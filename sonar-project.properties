sonar.projectKey=Team-Haruki_Haruki-Nuverse-StructTool
sonar.organization=team-haruki
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.exclusions=data/**,**/*_test.go,python/tests/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go,python/tests/**
sonar.go.coverage.reportPaths=coverage.out
sonar.python.coverage.reportPaths=python/coverage.xml

# Workflows call seiunx-dev/ci-templates by its major tag (@v1) on purpose so template
# fixes roll out without per-repo PRs; the third-party actions inside the templates are
# SHA-pinned. Do not flag the @v1 references (githubactions:S7637).
sonar.issue.ignore.multicriteria=ci1
sonar.issue.ignore.multicriteria.ci1.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.ci1.resourceKey=.github/workflows/*.yml
