name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PRs: one group per PR, newer pushes cancel older runs. Everything else: one group per
# event and commit, so a queued main run is never replaced by a newer one (every commit keeps
# its "CI OK" and :sha-<sha> image for the release gate and promote-on-tag).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    uses: seiunx-dev/ci-templates/.github/workflows/go-ci.yml@v1
    with:
      coverage: true

  rust:
    name: Rust
    uses: seiunx-dev/ci-templates/.github/workflows/rust-ci.yml@v1
    with:
      working-directory: rust/avro_parser # fmt, clippy and the #[cfg(test)] tests (was cargo check only)

  python:
    name: Python
    uses: seiunx-dev/ci-templates/.github/workflows/python-uv-ci.yml@v1
    with:
      working-directory: python
      sync-args: --locked --group test
      ruff: false # the package is not ruff-clean yet (F401/F402 + formatting); enable after a cleanup PR
      # unittest under coverage, then the old CI's decode smoke test against the real master schema
      test-command: >-
        uv run coverage run --source=avro_parser -m unittest discover -s tests &&
        uv run python -c 'from avro_parser import LoadFile, Decode; reg, root = LoadFile("../data/master.avsc");
        print(Decode(reg["Sekai.MasterActionSet"], bytes.fromhex("9B0104A46E6F6E65C2C0AD61735F636473686F705F6D6F62C09101C0CF00000157B64DF001C0")))' &&
        uv run coverage xml -o coverage/python.xml
      coverage-path: coverage/python.xml

  sonar:
    name: Sonar
    needs: [go, python]
    uses: seiunx-dev/ci-templates/.github/workflows/sonar.yml@v1
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  workflows:
    name: Workflow lint
    uses: seiunx-dev/ci-templates/.github/workflows/actionlint.yml@v1

  ci-ok:
    name: CI OK # the only required status check
    if: always()
    needs: [go, rust, python, sonar, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
